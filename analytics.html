<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agartha Admin | Analytics Console</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/brand/favicon.png" type="image/png" />
  <meta name="theme-color" content="#4F4A21" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body { padding-bottom: 0 !important; }
    .admin-wrap { max-width: 1240px; margin: 0 auto; padding: 110px 24px 70px; }
    .admin-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; }
    .admin-top h1 { font-size: 30px; }
    .admin-badge { font-size: 13px; color: var(--ink-soft); }
    .admin-links { display: flex; gap: 10px; flex-wrap: wrap; }

    .auth-card { max-width: 420px; margin: 40px auto 0; }
    .auth-card .form-note { display: none; margin-top: 14px; }
    .auth-toggle { margin-top: 18px; font-size: 14px; color: var(--ink-soft); text-align: center; }
    .auth-toggle a { color: var(--clay); text-decoration: underline; cursor: pointer; }

    /* Tabs */
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--sand-deep); margin-bottom: 24px; }
    .tab { border: 0; background: none; font-family: var(--font-body); font-size: 14.5px; color: var(--ink-soft);
      padding: 12px 18px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab:hover { color: var(--ink); }
    .tab.active { color: var(--forest); border-bottom-color: var(--clay); font-weight: 500; }

    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 22px; }
    .toolbar .spacer { flex: 1; }
    .rangebtns { display: inline-flex; background: var(--white); border: 1px solid var(--sand-deep); border-radius: 10px; overflow: hidden; }
    .rangebtns button { border: 0; background: none; padding: 9px 15px; font-family: var(--font-body); font-size: 13px; color: var(--ink-soft); cursor: pointer; }
    .rangebtns button.active { background: var(--forest); color: var(--cream); }
    .toolbar .btn { padding: 9px 18px; font-size: 13px; }

    .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .tile { background: var(--white); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; }
    .tile .n { font-size: 27px; font-weight: 600; color: var(--forest); line-height: 1.1; }
    .tile .l { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); margin-top: 6px; }
    .tile .sub { font-size: 12px; color: var(--moss); margin-top: 4px; }

    .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .panel { background: var(--white); border-radius: 14px; box-shadow: var(--shadow); padding: 20px 22px; }
    .panel.wide { grid-column: 1 / -1; }
    .panel h3 { font-size: 16px; margin-bottom: 4px; color: var(--forest); }
    .panel .hint { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 14px; }

    .barrow { display: grid; grid-template-columns: 130px 1fr 52px; align-items: center; gap: 12px; margin-bottom: 9px; font-size: 13.5px; }
    .barrow .lbl { color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .barrow .track { background: var(--cream); border-radius: 999px; height: 12px; overflow: hidden; }
    .barrow .fill { height: 100%; background: linear-gradient(90deg, var(--clay), var(--forest)); border-radius: 999px; }
    .barrow .val { text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

    .funnel { display: grid; gap: 10px; }
    .funnel .step { background: var(--cream); border-radius: 10px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
    .funnel .step .k { font-size: 13.5px; color: var(--ink); }
    .funnel .step .v { font-weight: 600; color: var(--forest); }
    .funnel .step .pct { font-size: 12px; color: var(--moss); margin-left: 10px; }

    .chart { width: 100%; height: 200px; }
    .chart text { fill: var(--ink-soft); font-size: 11px; font-family: var(--font-body); }

    .empty { text-align: center; color: var(--ink-soft); padding: 40px 20px; background: var(--white); border-radius: 14px; box-shadow: var(--shadow); }
    .hidden { display: none !important; }
    .muted { color: var(--ink-soft); font-size: 13px; }

    /* SEO audit */
    .seo-summary { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-bottom: 20px; }
    .score-ring { --v: 0; width: 120px; height: 120px; border-radius: 50%; flex: none;
      background: conic-gradient(var(--clay) calc(var(--v) * 1%), var(--cream) 0);
      display: grid; place-items: center; position: relative; }
    .score-ring::after { content: ""; position: absolute; inset: 12px; background: var(--white); border-radius: 50%; }
    .score-ring .sv { position: relative; z-index: 1; text-align: center; }
    .score-ring .sv b { font-size: 30px; color: var(--forest); font-weight: 600; }
    .score-ring .sv span { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
    .seo-card { border: 1px solid var(--sand-deep); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; background: var(--white); }
    .seo-card summary { cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .seo-card summary::-webkit-details-marker { display: none; }
    .seo-card .pg { font-weight: 500; color: var(--forest); font-size: 15px; }
    .seo-card .pgscore { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .checks { margin-top: 14px; display: grid; gap: 8px; }
    .check { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 13.5px; align-items: start; }
    .chip { font-size: 15px; line-height: 1.3; }
    .check .msg { color: var(--ink-soft); }
    .check .msg b { color: var(--ink); font-weight: 500; }
    .pass { color: #4e7a4e; } .warn { color: #b98a2e; } .fail { color: #a05252; }
    .recs { display: grid; gap: 8px; }
    .rec { display: grid; grid-template-columns: auto 1fr; gap: 10px; font-size: 13.5px; padding: 10px 12px; background: var(--cream); border-radius: 8px; }
    .rec .sev { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; align-self: start; white-space: nowrap; }
    .sev.high { background: #f2dede; color: #a05252; } .sev.med { background: #f6ecd6; color: #9a7420; } .sev.low { background: #e6ede6; color: #4e7a4e; }

    @media (max-width: 820px) { .panels { grid-template-columns: 1fr; } }
    @media (max-width: 520px) { .barrow { grid-template-columns: 96px 1fr 44px; } }
  </style>
</head>
<body>

  <header class="site-header" id="siteHeader">
    <div class="container">
      <a class="brand" href="index.html">
        <img class="brand-mark-img" src="assets/brand/mark-sage.png" alt="" />
        <img class="brand-word-img" src="assets/brand/wordmark-sage.png" alt="Agartha" />
      </a>
      <span style="color:#f1eee4; font-size:13px; letter-spacing:0.2em; text-transform:uppercase;">Admin</span>
    </div>
  </header>

  <div class="admin-wrap">

    <!-- ===== Login ===== -->
    <div id="authView">
      <div class="center">
        <h1 class="section-title">Analytics Console</h1>
        <p class="section-sub" style="margin: 0 auto;">Sign in with your Agartha admin account to view traffic, conversions and the SEO audit.</p>
      </div>
      <form class="form-card auth-card" id="authForm">
        <div class="form-grid" style="grid-template-columns: 1fr;">
          <div class="field">
            <label for="authEmail">Email</label>
            <input id="authEmail" type="email" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="authPass">Password</label>
            <input id="authPass" type="password" autocomplete="current-password" minlength="8" required />
          </div>
          <button type="submit" class="btn btn-primary" id="authBtn" style="justify-content:center;">Sign In</button>
          <p class="form-note" id="authNote"></p>
        </div>
      </form>
      <p class="auth-toggle">Manage leads instead? <a href="admin.html">Open the Lead Manager</a></p>
    </div>

    <!-- ===== Console ===== -->
    <div id="consoleView" class="hidden">
      <div class="admin-top">
        <div>
          <h1>Analytics Console</h1>
          <span class="admin-badge" id="whoami"></span>
        </div>
        <div class="admin-links">
          <a class="btn btn-outline" href="admin.html" style="padding:9px 18px; font-size:13px;">Lead Manager</a>
          <button class="btn btn-outline" id="signOut" style="padding: 9px 18px; font-size: 13px;">Sign Out</button>
        </div>
      </div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="overview">Overview</button>
        <button class="tab" data-tab="visitors">Visitors</button>
        <button class="tab" data-tab="leads">Leads &amp; Conversion</button>
        <button class="tab" data-tab="seo">SEO Audit</button>
      </div>

      <div class="toolbar" id="dataToolbar">
        <div class="rangebtns" id="rangeBtns">
          <button data-days="7">7 days</button>
          <button data-days="30" class="active">30 days</button>
          <button data-days="90">90 days</button>
        </div>
        <span class="muted" id="rangeNote"></span>
        <span class="spacer"></span>
        <button class="btn btn-outline" id="refresh">Refresh</button>
        <button class="btn btn-primary" id="exportBtn">Export</button>
      </div>

      <div id="tab-overview" class="tabpane"></div>
      <div id="tab-visitors" class="tabpane hidden"></div>
      <div id="tab-leads" class="tabpane hidden"></div>
      <div id="tab-seo" class="tabpane hidden"></div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.4/dist/umd/supabase.js" integrity="sha384-ysv13JVP3fufiEXfjML9OdCa/rRbMJvUBOWyor82wfuK8INNZAvmbxHgKIHi+oqz" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/config.js"></script>
  <script>
  (function () {
    "use strict";
    var cfg = window.AGARTHA_BACKEND;
    var db = window.supabase.createClient(cfg.url, cfg.key);

    var authView = document.getElementById("authView");
    var consoleView = document.getElementById("consoleView");
    var authForm = document.getElementById("authForm");
    var authNote = document.getElementById("authNote");
    var authBtn = document.getElementById("authBtn");

    var events = [], leads = [], rangeDays = 30, activeTab = "overview";
    var seoResult = null; // cached audit

    // ---------- helpers ----------
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
      });
    }
    function note(msg, ok) {
      authNote.textContent = msg;
      authNote.style.display = "block";
      authNote.style.color = ok ? "var(--moss)" : "#a05252";
    }
    function dayKey(d) {
      var x = new Date(d);
      return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
    }
    function cutoff() { return Date.now() - rangeDays * 86400000; }
    function fmtDur(ms) {
      if (!ms || ms < 0) return "0s";
      var s = Math.round(ms / 1000);
      if (s < 60) return s + "s";
      var m = Math.floor(s / 60); s = s % 60;
      return m + "m " + (s < 10 ? "0" : "") + s + "s";
    }
    function pct(a, b) { return b ? Math.round((a / b) * 1000) / 10 : 0; }
    function topCounts(arr, keyFn, limit) {
      var m = {};
      arr.forEach(function (x) { var k = keyFn(x); if (k == null || k === "") return; m[k] = (m[k] || 0) + 1; });
      return Object.keys(m).map(function (k) { return { label: k, value: m[k] }; })
        .sort(function (a, b) { return b.value - a.value; }).slice(0, limit || 8);
    }
    function bars(items, opts) {
      opts = opts || {};
      if (!items.length) return '<p class="muted">No data in this range yet.</p>';
      var max = Math.max.apply(null, items.map(function (i) { return i.value; })) || 1;
      return items.map(function (i) {
        var w = Math.max(2, Math.round((i.value / max) * 100));
        var lbl = opts.map ? opts.map(i.label) : i.label;
        return '<div class="barrow"><span class="lbl" title="' + esc(i.label) + '">' + esc(lbl) +
          '</span><span class="track"><span class="fill" style="width:' + w + '%"></span></span>' +
          '<span class="val">' + i.value + "</span></div>";
      }).join("");
    }
    // Responsive inline-SVG area+line chart from [{label,value}]
    function lineChart(series, unit) {
      if (!series.length) return '<p class="muted">No data in this range yet.</p>';
      var W = 720, H = 200, pad = 28, n = series.length;
      var max = Math.max.apply(null, series.map(function (s) { return s.value; })) || 1;
      var stepX = n > 1 ? (W - pad * 2) / (n - 1) : 0;
      var x = function (i) { return pad + stepX * i; };
      var y = function (v) { return H - pad - (v / max) * (H - pad * 2); };
      var pts = series.map(function (s, i) { return x(i) + "," + y(s.value); });
      var area = "M" + x(0) + "," + (H - pad) + " L" + pts.join(" L") + " L" + x(n - 1) + "," + (H - pad) + " Z";
      var line = "M" + pts.join(" L");
      var ticks = "";
      [0, 0.5, 1].forEach(function (t) {
        var yy = pad + (H - pad * 2) * t;
        ticks += '<line x1="' + pad + '" y1="' + yy + '" x2="' + (W - pad) + '" y2="' + yy +
          '" stroke="var(--sand-deep)" stroke-width="0.5" opacity="0.5"/>';
      });
      var dots = series.map(function (s, i) {
        return '<circle cx="' + x(i) + '" cy="' + y(s.value) + '" r="2.5" fill="var(--forest)"><title>' +
          esc(s.label) + ": " + s.value + (unit ? " " + unit : "") + "</title></circle>";
      }).join("");
      var first = series[0].label, last = series[n - 1].label;
      return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" role="img">' +
        ticks +
        '<path d="' + area + '" fill="var(--clay)" opacity="0.14"/>' +
        '<path d="' + line + '" fill="none" stroke="var(--forest)" stroke-width="2" stroke-linejoin="round"/>' +
        dots +
        '<text x="' + pad + '" y="' + (H - 6) + '">' + esc(first) + "</text>" +
        '<text x="' + (W - pad) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(last) + "</text>" +
        '<text x="' + pad + '" y="' + (pad - 8) + '">' + max + (unit ? " " + unit : "") + "</text>" +
        "</svg>";
    }
    function tile(n, l, sub) {
      return '<div class="tile"><div class="n">' + n + '</div><div class="l">' + l + "</div>" +
        (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>";
    }
    function dailySeries(rows, dateField) {
      var days = rangeDays, out = [], map = {};
      rows.forEach(function (r) { var k = dayKey(r[dateField]); map[k] = (map[k] || 0) + 1; });
      for (var i = days - 1; i >= 0; i--) {
        var d = new Date(Date.now() - i * 86400000);
        var k = dayKey(d);
        out.push({ label: (d.getMonth() + 1) + "/" + d.getDate(), value: map[k] || 0 });
      }
      return out;
    }

    // ---------- auth ----------
    authForm.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("authEmail").value.trim();
      var password = document.getElementById("authPass").value;
      authBtn.disabled = true;
      db.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
        authBtn.disabled = false;
        if (res.error) return note(res.error.message, false);
        enter(res.data.session);
      });
    });
    document.getElementById("signOut").addEventListener("click", function () {
      db.auth.signOut().then(function () { location.reload(); });
    });
    db.auth.getSession().then(function (res) { if (res.data.session) enter(res.data.session); });

    function enter(session) {
      if (!session) return;
      // Confirm this account is on the admin allowlist (RLS: admins can read own row).
      db.from("agartha_admins").select("email").limit(1).then(function (res) {
        if (res.error || !res.data || !res.data.length) {
          note("This account isn't on the admin allowlist. Ask an existing admin to add your email.", false);
          db.auth.signOut();
          return;
        }
        document.getElementById("whoami").textContent = session.user.email;
        authView.classList.add("hidden");
        consoleView.classList.remove("hidden");
        loadAll();
      });
    }

    // ---------- data ----------
    function loadAll() {
      var since = new Date(Date.now() - 90 * 86400000).toISOString();
      Promise.all([
        db.from("agartha_events").select("*").gte("created_at", since).order("created_at", { ascending: false }).limit(50000),
        db.from("agartha_leads").select("*").order("created_at", { ascending: false })
      ]).then(function (r) {
        events = (r[0] && r[0].data) || [];
        leads = (r[1] && r[1].data) || [];
        renderActive();
      });
    }

    // ---------- range + tabs ----------
    document.getElementById("rangeBtns").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-days]"); if (!b) return;
      rangeDays = parseInt(b.getAttribute("data-days"), 10);
      Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle("active", c === b); });
      renderActive();
    });
    document.getElementById("tabs").addEventListener("click", function (e) {
      var b = e.target.closest(".tab"); if (!b) return;
      activeTab = b.getAttribute("data-tab");
      Array.prototype.forEach.call(this.children, function (c) { c.classList.toggle("active", c === b); });
      ["overview", "visitors", "leads", "seo"].forEach(function (t) {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== activeTab);
      });
      // The range selector only applies to traffic/lead views, not the SEO audit.
      document.getElementById("dataToolbar").classList.toggle("hidden", activeTab === "seo");
      renderActive();
    });
    document.getElementById("refresh").addEventListener("click", function () {
      if (activeTab === "seo") { seoResult = null; renderSeo(true); } else loadAll();
    });
    document.getElementById("exportBtn").addEventListener("click", exportData);

    function renderActive() {
      document.getElementById("rangeNote").textContent =
        "Last " + rangeDays + " days · " + scoped(events, "created_at").length + " events · " + scoped(leads, "created_at").length + " leads";
      if (activeTab === "overview") renderOverview();
      else if (activeTab === "visitors") renderVisitors();
      else if (activeTab === "leads") renderLeads();
      else renderSeo(false);
    }
    function scoped(rows) {
      var c = cutoff();
      return rows.filter(function (r) { return new Date(r.created_at).getTime() >= c; });
    }

    // Derived: metrics from the scoped event set
    function metrics() {
      var ev = scoped(events);
      var pv = ev.filter(function (e) { return e.event_type === "pageview"; });
      var eng = ev.filter(function (e) { return e.event_type === "engagement"; });
      var visitors = {}, sessions = {}, newVis = {};
      pv.forEach(function (e) {
        if (e.visitor_id) { visitors[e.visitor_id] = 1; if (e.is_new_visitor) newVis[e.visitor_id] = 1; }
        if (e.session_id) sessions[e.session_id] = (sessions[e.session_id] || 0) + 1;
      });
      var sessCount = Object.keys(sessions).length;
      var single = Object.keys(sessions).filter(function (k) { return sessions[k] === 1; }).length;
      var dwell = eng.filter(function (e) { return e.dwell_ms != null; }).map(function (e) { return e.dwell_ms; });
      var scroll = eng.filter(function (e) { return e.scroll_pct != null; }).map(function (e) { return e.scroll_pct; });
      var avgDwell = dwell.length ? dwell.reduce(function (a, b) { return a + b; }, 0) / dwell.length : 0;
      var avgScroll = scroll.length ? Math.round(scroll.reduce(function (a, b) { return a + b; }, 0) / scroll.length) : 0;
      // Acquisition channel = each session's first (oldest) pageview referrer.
      var firstBySess = {};
      pv.slice().sort(function (a, b) { return new Date(a.created_at) - new Date(b.created_at); }).forEach(function (e) {
        if (e.session_id && !firstBySess[e.session_id]) firstBySess[e.session_id] = e;
      });
      var channels = {};
      Object.keys(firstBySess).forEach(function (s) {
        var e = firstBySess[s];
        var src = e.referrer_host && e.referrer_host !== "internal" ? e.referrer_host : "direct";
        if (e.utm_source) src = e.utm_source;
        channels[src] = (channels[src] || 0) + 1;
      });
      var chanArr = Object.keys(channels).map(function (k) { return { label: k, value: channels[k] }; })
        .sort(function (a, b) { return b.value - a.value; }).slice(0, 8);
      return {
        pv: pv, eng: eng,
        pageviews: pv.length,
        visitors: Object.keys(visitors).length,
        newVisitors: Object.keys(newVis).length,
        sessions: sessCount,
        bounce: pct(single, sessCount),
        avgDwell: avgDwell, avgScroll: avgScroll,
        channels: chanArr
      };
    }

    // ---------- OVERVIEW ----------
    function renderOverview() {
      var el = document.getElementById("tab-overview");
      var m = metrics();
      var scopedLeads = scoped(leads);
      var conv = pct(scopedLeads.length, m.visitors);
      if (!scoped(events).length && !scopedLeads.length) { el.innerHTML = emptyState(); return; }
      el.innerHTML =
        '<div class="tiles">' +
          tile(m.pageviews, "Pageviews") +
          tile(m.visitors, "Unique visitors", m.newVisitors + " new · " + (m.visitors - m.newVisitors) + " returning") +
          tile(m.sessions, "Sessions") +
          tile(fmtDur(m.avgDwell), "Avg. time on page") +
          tile(scopedLeads.length, "Leads captured") +
          tile(conv + "%", "Visitor→lead rate") +
        "</div>" +
        '<div class="panels">' +
          '<div class="panel wide"><h3>Pageviews per day</h3><div class="hint">Daily traffic across the last ' + rangeDays + ' days.</div>' + lineChart(dailySeries(m.pv, "created_at"), "") + "</div>" +
          '<div class="panel"><h3>Top pages</h3><div class="hint">Most-viewed pages.</div>' + bars(topCounts(m.pv, function (e) { return e.path; }, 7), { map: prettyPath }) + "</div>" +
          '<div class="panel"><h3>Traffic sources</h3><div class="hint">Where sessions came from.</div>' + bars(m.channels) + "</div>" +
        "</div>";
    }
    function emptyState() {
      return '<div class="empty"><h3 style="color:var(--forest);margin-bottom:8px;">No visits recorded yet</h3>' +
        '<p class="muted" style="max-width:520px;margin:0 auto;">The cookieless tracker is live on every public page. As soon as visitors browse the site, traffic will appear here. The <b>SEO Audit</b> tab works right now — it checks the live pages directly.</p></div>';
    }
    function prettyPath(p) {
      if (!p || p === "/") return "Home";
      return p.replace(/^\//, "").replace(/\.html$/, "").replace(/-/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); }) || p;
    }

    // ---------- VISITORS ----------
    function renderVisitors() {
      var el = document.getElementById("tab-visitors");
      var m = metrics();
      if (!scoped(events).length) { el.innerHTML = emptyState(); return; }
      el.innerHTML =
        '<div class="tiles">' +
          tile(m.pageviews, "Pageviews") +
          tile(m.visitors, "Unique visitors") +
          tile(m.sessions, "Sessions") +
          tile((m.sessions ? Math.round((m.pageviews / m.sessions) * 10) / 10 : 0), "Pages / session") +
          tile(m.bounce + "%", "Bounce rate", "single-page sessions") +
          tile(m.avgScroll + "%", "Avg. scroll depth") +
        "</div>" +
        '<div class="panels">' +
          '<div class="panel wide"><h3>Unique visitors per day</h3>' + lineChart(dailyUnique(m.pv), "") + "</div>" +
          '<div class="panel"><h3>Top pages</h3>' + bars(topCounts(m.pv, function (e) { return e.path; }, 8), { map: prettyPath }) + "</div>" +
          '<div class="panel"><h3>Referrers</h3><div class="hint">Session entry source.</div>' + bars(m.channels) + "</div>" +
          '<div class="panel"><h3>Devices</h3>' + bars(topCounts(m.pv, function (e) { return e.device; }, 5), { map: cap }) + "</div>" +
          '<div class="panel"><h3>Browsers</h3>' + bars(topCounts(m.pv, function (e) { return e.browser; }, 6)) + "</div>" +
        "</div>";
    }
    function cap(s) { return String(s || "").replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }
    function dailyUnique(pv) {
      var days = rangeDays, out = [], map = {};
      pv.forEach(function (e) {
        var k = dayKey(e.created_at);
        (map[k] = map[k] || {})[e.visitor_id || e.session_id || Math.random()] = 1;
      });
      for (var i = days - 1; i >= 0; i--) {
        var d = new Date(Date.now() - i * 86400000), k = dayKey(d);
        out.push({ label: (d.getMonth() + 1) + "/" + d.getDate(), value: map[k] ? Object.keys(map[k]).length : 0 });
      }
      return out;
    }

    // ---------- LEADS & CONVERSION ----------
    function renderLeads() {
      var el = document.getElementById("tab-leads");
      var m = metrics();
      var L = scoped(leads);
      var ev = scoped(events);
      var submitSessions = {};
      ev.filter(function (e) { return e.event_type === "form_submit"; }).forEach(function (e) { if (e.session_id) submitSessions[e.session_id] = 1; });
      var engaged = ev.filter(function (e) { return e.event_type === "engagement" && (e.scroll_pct >= 50 || e.dwell_ms >= 15000); });
      var engagedSess = {}; engaged.forEach(function (e) { if (e.session_id) engagedSess[e.session_id] = 1; });
      var conv = pct(L.length, m.visitors);

      var funnel = [
        { k: "Unique visitors", v: m.visitors },
        { k: "Engaged (scroll 50%+ / 15s+)", v: Object.keys(engagedSess).length },
        { k: "Form submissions", v: Object.keys(submitSessions).length },
        { k: "Leads captured", v: L.length }
      ];
      var base = funnel[0].v || 1;

      el.innerHTML =
        '<div class="tiles">' +
          tile(L.length, "Leads captured") +
          tile(conv + "%", "Visitor→lead rate") +
          tile(L.filter(function (l) { return l.status === "new"; }).length, "New / unactioned") +
          tile(L.filter(function (l) { return l.status === "visit_scheduled"; }).length, "Visits scheduled") +
          tile(L.filter(function (l) { return l.status === "closed"; }).length, "Closed / won") +
        "</div>" +
        '<div class="panels">' +
          '<div class="panel wide"><h3>Conversion funnel</h3><div class="hint">From anonymous visitor to captured lead, over the last ' + rangeDays + ' days.</div><div class="funnel">' +
            funnel.map(function (f) {
              return '<div class="step"><span class="k">' + esc(f.k) + '</span><span><span class="v">' + f.v +
                '</span><span class="pct">' + pct(f.v, base) + '%</span></span></div>';
            }).join("") + "</div></div>" +
          '<div class="panel wide"><h3>Leads per day</h3>' + lineChart(dailySeries(L, "created_at"), "") + "</div>" +
          '<div class="panel"><h3>Leads by form</h3>' + bars(topCounts(L, function (l) { return l.form_type; }, 6), { map: cap }) + "</div>" +
          '<div class="panel"><h3>Leads by landing page</h3>' + bars(topCounts(L, function (l) { return l.source_page; }, 6), { map: prettyPath }) + "</div>" +
          '<div class="panel"><h3>Leads by status</h3>' + bars(topCounts(L, function (l) { return l.status; }, 6), { map: function (s) { return cap(String(s).replace(/_/g, " ")); } }) + "</div>" +
          '<div class="panel"><h3>Lead sources</h3><div class="hint">Traffic channel where each lead\'s session started (when known).</div>' + bars(m.channels) + "</div>" +
        "</div>" +
        '<p class="muted" style="margin-top:16px;">Full lead records — contact details, notes, status — live in the <a href="admin.html" style="color:var(--clay);">Lead Manager</a>.</p>';
    }

    // ---------- SEO AUDIT ----------
    var SEO_PAGES = [
      { url: "index.html", name: "Home" },
      { url: "investment.html", name: "Investment" },
      { url: "membership.html", name: "Membership" },
      { url: "holiday-homes.html", name: "Holiday Homes" },
      { url: "gallery.html", name: "Gallery" },
      { url: "contact.html", name: "Contact" }
    ];
    // weight: importance of each check toward the score
    function auditDoc(doc, html) {
      var checks = [];
      function add(status, label, msg, weight) { checks.push({ status: status, label: label, msg: msg, weight: weight || 1 }); }
      var head = doc.head || doc;

      var title = (doc.querySelector("title") || {}).textContent || "";
      title = title.trim();
      if (!title) add("fail", "Title tag", "Missing <title>.", 3);
      else if (title.length < 15 || title.length > 65) add("warn", "Title tag", "<b>" + title.length + " chars</b> — aim for 30–60. “" + title + "”", 3);
      else add("pass", "Title tag", "<b>" + title.length + " chars.</b> “" + title + "”", 3);

      var descEl = doc.querySelector('meta[name="description"]');
      var desc = descEl ? (descEl.getAttribute("content") || "").trim() : "";
      if (!desc) add("fail", "Meta description", "Missing meta description.", 3);
      else if (desc.length < 60 || desc.length > 165) add("warn", "Meta description", "<b>" + desc.length + " chars</b> — aim for 70–160.", 3);
      else add("pass", "Meta description", "<b>" + desc.length + " chars.</b>", 3);

      var h1s = doc.querySelectorAll("h1");
      if (h1s.length === 0) add("fail", "H1 heading", "No H1 on the page.", 2);
      else if (h1s.length > 1) add("warn", "H1 heading", h1s.length + " H1s — use exactly one.", 2);
      else add("pass", "H1 heading", "Exactly one H1.", 2);

      add(doc.querySelector('link[rel="canonical"]') ? "pass" : "fail",
        "Canonical URL", doc.querySelector('link[rel="canonical"]') ? "Canonical link present." : "No <link rel=\"canonical\"> — add one to prevent duplicate-URL dilution.", 2);

      var og = ["og:title", "og:description", "og:image", "og:type", "og:url"].filter(function (p) { return doc.querySelector('meta[property="' + p + '"]'); });
      if (og.length >= 4) add(og.indexOf("og:url") === -1 ? "warn" : "pass", "Open Graph", og.length + "/5 tags present" + (og.indexOf("og:url") === -1 ? " (add og:url)." : "."), 1);
      else add("warn", "Open Graph", "Only " + og.length + "/5 OG tags — weak link previews.", 1);

      var tw = ["twitter:card", "twitter:title", "twitter:description", "twitter:image"].filter(function (p) { return doc.querySelector('meta[name="' + p + '"]'); });
      if (tw.length >= 4) add("pass", "Twitter cards", "All 4 Twitter tags present.", 1);
      else add("warn", "Twitter cards", tw.length + "/4 Twitter tags — add title, description & image for rich X/Twitter previews.", 1);

      add(doc.querySelector('script[type="application/ld+json"]') ? "pass" : "warn",
        "Structured data", doc.querySelector('script[type="application/ld+json"]') ? "JSON-LD present." : "No JSON-LD schema — add Organization/LocalBusiness for rich results.", 2);

      var htmlTag = doc.documentElement;
      add(htmlTag && htmlTag.getAttribute("lang") ? "pass" : "warn", "Language", htmlTag && htmlTag.getAttribute("lang") ? 'lang="' + htmlTag.getAttribute("lang") + '".' : "No lang attribute on <html>.", 1);

      add(doc.querySelector('meta[name="viewport"]') ? "pass" : "fail", "Mobile viewport", doc.querySelector('meta[name="viewport"]') ? "Viewport meta present." : "Missing viewport meta.", 2);

      var imgs = doc.querySelectorAll("img");
      var missing = 0; // an <img> with no alt attribute at all (empty alt="" is valid for decorative images)
      imgs.forEach(function (im) { if (!im.hasAttribute("alt")) missing++; });
      if (imgs.length === 0) add("pass", "Image alt text", "No images.", 1);
      else if (missing === 0) add("pass", "Image alt text", imgs.length + " images, all have alt attributes.", 1);
      else add("warn", "Image alt text", missing + " of " + imgs.length + " images missing alt — hurts accessibility & image SEO.", 1);

      var robots = doc.querySelector('meta[name="robots"]');
      if (robots && /noindex/i.test(robots.getAttribute("content") || "")) add("fail", "Indexability", "Page is set to <b>noindex</b> — it won't appear in search.", 3);
      else add("pass", "Indexability", "Indexable (no noindex).", 3);

      var words = (doc.body ? doc.body.textContent : "").replace(/\s+/g, " ").trim().split(" ").filter(Boolean).length;
      if (words < 250) add("warn", "Content depth", "~" + words + " words — thin content ranks poorly. Aim for 300+.", 1);
      else add("pass", "Content depth", "~" + words + " words.", 1);

      add(doc.querySelector('link[rel~="icon"]') ? "pass" : "warn", "Favicon", doc.querySelector('link[rel~="icon"]') ? "Favicon linked." : "No favicon link.", 0.5);

      return checks;
    }
    function scoreOf(checks) {
      var got = 0, tot = 0;
      checks.forEach(function (c) { tot += c.weight; got += c.weight * (c.status === "pass" ? 1 : c.status === "warn" ? 0.5 : 0); });
      return tot ? Math.round((got / tot) * 100) : 0;
    }
    function renderSeo(force) {
      var el = document.getElementById("tab-seo");
      if (seoResult && !force) { paintSeo(el, seoResult); return; }
      el.innerHTML = '<div class="empty"><p class="muted">Auditing ' + SEO_PAGES.length + ' pages live…</p></div>';
      var jobs = SEO_PAGES.map(function (p) {
        return fetch(p.url, { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (html) {
          var doc = new DOMParser().parseFromString(html, "text/html");
          var checks = auditDoc(doc, html);
          return { page: p, checks: checks, score: scoreOf(checks), ok: true };
        }).catch(function () { return { page: p, checks: [], score: null, ok: false }; });
      });
      var siteJobs = Promise.all([
        fetch("robots.txt", { cache: "no-store" }).then(function (r) { return r.ok; }).catch(function () { return false; }),
        fetch("sitemap.xml", { cache: "no-store" }).then(function (r) { return r.ok; }).catch(function () { return false; })
      ]);
      Promise.all([Promise.all(jobs), siteJobs]).then(function (all) {
        seoResult = { pages: all[0], robots: all[1][0], sitemap: all[1][1] };
        paintSeo(el, seoResult);
      });
    }
    function paintSeo(el, res) {
      var ok = res.pages.filter(function (p) { return p.ok; });
      if (!ok.length) {
        el.innerHTML = '<div class="empty"><h3 style="color:var(--forest)">Couldn\'t reach the pages</h3><p class="muted" style="max-width:520px;margin:8px auto 0;">The live audit fetches each page from this same site. It works on the deployed site (agartha-zeta.vercel.app) — open the console there, or serve the folder over http rather than opening the file directly.</p></div>';
        return;
      }
      var avg = Math.round(ok.reduce(function (a, p) { return a + p.score; }, 0) / ok.length);
      // adjust for site-level checks (robots + sitemap) worth a few points
      var siteBonus = (res.robots ? 0 : -4) + (res.sitemap ? 0 : -4);
      avg = Math.max(0, Math.min(100, avg + siteBonus));
      var grade = avg >= 90 ? "A" : avg >= 80 ? "B" : avg >= 70 ? "C" : avg >= 55 ? "D" : "F";

      // aggregate recommendations
      var recs = [];
      if (!res.robots) recs.push({ sev: "high", t: "Add robots.txt", d: "No /robots.txt found — crawlers can't find crawl directives or your sitemap link." });
      if (!res.sitemap) recs.push({ sev: "high", t: "Add sitemap.xml", d: "No /sitemap.xml found — submit one so search engines discover every page." });
      var bucket = {};
      ok.forEach(function (p) {
        p.checks.forEach(function (c) {
          if (c.status === "pass") return;
          var key = c.label + "|" + c.status;
          (bucket[key] = bucket[key] || { label: c.label, status: c.status, pages: [], weight: c.weight }).pages.push(p.page.name);
        });
      });
      Object.keys(bucket).forEach(function (k) {
        var b = bucket[k];
        var sev = b.status === "fail" ? (b.weight >= 2 ? "high" : "med") : "low";
        recs.push({ sev: sev, t: b.label + (b.status === "fail" ? " missing" : " needs attention"),
          d: "On " + b.pages.length + " page" + (b.pages.length > 1 ? "s" : "") + ": " + b.pages.join(", ") + "." });
      });
      var order = { high: 0, med: 1, low: 2 };
      recs.sort(function (a, b) { return order[a.sev] - order[b.sev]; });

      var html =
        '<div class="panel wide" style="margin-bottom:18px;"><div class="seo-summary">' +
          '<div class="score-ring" style="--v:' + avg + '"><div class="sv"><b>' + avg + '</b><span>' + grade + " grade</span></div></div>" +
          '<div><h3 style="margin-bottom:6px;">Site SEO score</h3>' +
            '<p class="muted" style="max-width:460px;">Live audit of ' + ok.length + ' pages against ~14 on-page ranking factors, plus site-level robots.txt & sitemap.xml. ' +
            'robots.txt: <b class="' + (res.robots ? "pass" : "fail") + '">' + (res.robots ? "found" : "missing") + "</b> · sitemap.xml: <b class=\"" + (res.sitemap ? "pass" : "fail") + '">' + (res.sitemap ? "found" : "missing") + "</b></p></div>" +
        "</div></div>";

      if (recs.length) {
        html += '<div class="panel wide" style="margin-bottom:18px;"><h3>Prioritised fixes</h3><div class="hint">Highest-impact first.</div><div class="recs">' +
          recs.map(function (r) {
            return '<div class="rec"><span class="sev ' + r.sev + '">' + r.sev + '</span><span><b>' + esc(r.t) + "</b> — " + esc(r.d) + "</span></div>";
          }).join("") + "</div></div>";
      } else {
        html += '<div class="panel wide" style="margin-bottom:18px;"><h3>No issues found 🎉</h3><p class="muted">Every audited page passes the on-page checks.</p></div>';
      }

      html += res.pages.map(function (p) {
        if (!p.ok) return '<div class="seo-card"><div class="pg">' + esc(p.page.name) + " — <span class=\"fail\">could not load</span></div></div>";
        var g = p.score >= 90 ? "pass" : p.score >= 70 ? "warn" : "fail";
        return '<details class="seo-card"><summary><span class="pg">' + esc(p.page.name) + " <span class=\"muted\">(" + esc(p.page.url) + ")</span></span>" +
          '<span class="pgscore ' + g + '">' + p.score + "/100</span></summary>" +
          '<div class="checks">' + p.checks.map(function (c) {
            var icon = c.status === "pass" ? "✓" : c.status === "warn" ? "!" : "✕";
            return '<div class="check"><span class="chip ' + c.status + '">' + icon + '</span><span class="msg"><b>' + esc(c.label) + ":</b> " + c.msg + "</span></div>";
          }).join("") + "</div></details>";
      }).join("");

      el.innerHTML = html;
    }

    // ---------- export ----------
    function exportData() {
      if (activeTab === "seo") {
        if (!seoResult) return;
        var blob = new Blob([JSON.stringify(seoResult, null, 2)], { type: "application/json" });
        download(blob, "agartha-seo-audit.json");
        return;
      }
      var rows = activeTab === "leads" ? scoped(leads) : scoped(events);
      if (!rows.length) { alert("Nothing to export in this range."); return; }
      var cols = Object.keys(rows[0]).filter(function (k) { return k !== "meta"; });
      var csv = [cols.join(",")].concat(rows.map(function (r) {
        return cols.map(function (c) { return '"' + String(r[c] == null ? "" : r[c]).replace(/"/g, '""') + '"'; }).join(",");
      })).join("\n");
      download(new Blob([csv], { type: "text/csv" }), "agartha-" + activeTab + "-" + rangeDays + "d.csv");
    }
    function download(blob, name) {
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = name; a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    }
  })();
  </script>
</body>
</html>
