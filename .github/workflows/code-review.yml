name: Code Review

# Third-party actions are pinned to full commit SHAs, not tags or branches.
# A tag is mutable and a branch doubly so: whoever controls the action's repo
# can change what runs here at any time, with this repo's token in scope.
# GitHub's hardening guidance calls a full-length SHA the only immutable
# reference, and trivy-action has already had a supply-chain incident — which
# is precisely the case pinning defends against.
# The comment after each SHA is the tag it corresponded to when pinned.

on:
  push:
    branches:
      - '**'
  pull_request:

# Least privilege. Without this the workflow inherits the repository default,
# which can include write scopes these scanners have no use for.
permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    # semgrep/semgrep-action is deprecated and archived; the maintained path is
    # the official image running `semgrep ci`.
    container:
      image: semgrep/semgrep:1.145.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep scan
        run: semgrep scan --config auto --error --severity ERROR

  trivy:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # secret scanning needs the history, not just the tip
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No GITLEAKS_LICENSE: free on a personal account. It becomes
          # required if this repo ever moves under an organisation.

  frontend:
    name: Front-end Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CDN pinning, SRI, headers and link safety
        run: python3 scripts/check-security.py
